<svg width="1000" height="760" viewBox="0 0 1000 760" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'SF Pro Text', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="winbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f1f23"/>
      <stop offset="1" stop-color="#161619"/>
    </linearGradient>
    <clipPath id="clip"><rect x="20" y="20" width="960" height="720" rx="16"/></clipPath>
  </defs>

  <rect x="20" y="20" width="960" height="720" rx="16" fill="url(#winbg)" stroke="#3a3a40"/>
  <g clip-path="url(#clip)">

    <!-- Title bar -->
    <rect x="20" y="20" width="960" height="56" fill="#242428"/>
    <circle cx="50" cy="48" r="6.5" fill="#ff5f57"/>
    <circle cx="72" cy="48" r="6.5" fill="#febc2e"/>
    <circle cx="94" cy="48" r="6.5" fill="#28c840"/>
    <text x="126" y="54" fill="#ececf0" font-size="16" font-weight="600">Ollama — Settings</text>
    <g stroke="#8e8e96" stroke-width="2" stroke-linecap="round">
      <line x1="936" y1="41" x2="950" y2="55"/><line x1="950" y1="41" x2="936" y2="55"/>
    </g>

    <!-- Settings card -->
    <rect x="48" y="100" width="904" height="616" rx="14" fill="#1b1b1e" stroke="#2c2c31"/>

    <!-- Row 1: Cloud (off) -->
    <g transform="translate(84,146)" fill="none" stroke="#9a9aa2" stroke-width="2">
      <path d="M-2 4 a9 9 0 0 1 17 -4 a7 7 0 0 1 5 4 h1 a5 5 0 0 1 0 10 h-22 a5 5 0 0 1 -1 -10 z" stroke-linejoin="round"/>
    </g>
    <text x="124" y="146" fill="#ececf0" font-size="16" font-weight="500">Cloud</text>
    <text x="124" y="171" fill="#8b8b93" font-size="13.5">Enable cloud models and web search.</text>
    <rect x="866" y="128" width="52" height="30" rx="15" fill="#3a3a40"/>
    <circle cx="881" cy="143" r="12" fill="#f2f2f5"/>

    <!-- Row 2: Auto-download updates (on) -->
    <g transform="translate(84,232)" stroke="#9a9aa2" stroke-width="2" stroke-linecap="round" fill="none">
      <line x1="8" y1="-8" x2="8" y2="6"/>
      <polyline points="2,0 8,7 14,0" stroke-linejoin="round"/>
      <line x1="0" y1="12" x2="16" y2="12"/>
    </g>
    <text x="124" y="238" fill="#ececf0" font-size="16" font-weight="500">Auto-download updates</text>
    <text x="124" y="263" fill="#8b8b93" font-size="13.5">Automatically download updates when available.</text>
    <rect x="866" y="220" width="52" height="30" rx="15" fill="#55555e"/>
    <circle cx="903" cy="235" r="12" fill="#f2f2f5"/>

    <!-- Row 3: Expose to the network — THE ONE THAT MATTERS -->
    <rect x="62" y="292" width="876" height="84" rx="12" fill="#E37654" fill-opacity="0.10" stroke="#E37654" stroke-opacity="0.45"/>
    <g transform="translate(84,334)" fill="none" stroke="#E37654" stroke-width="2.2" stroke-linecap="round">
      <path d="M-3 -2 a16 16 0 0 1 22 0"/>
      <path d="M1 4 a10 10 0 0 1 14 0"/>
      <circle cx="8" cy="11" r="1.6" fill="#E37654" stroke="none"/>
    </g>
    <text x="124" y="330" fill="#ececf0" font-size="16" font-weight="600">Expose Ollama to the network</text>
    <text x="124" y="355" fill="#a8a8b0" font-size="13.5">Allow other devices or services to access Ollama.</text>
    <rect x="866" y="319" width="52" height="30" rx="15" fill="#E37654"/>
    <circle cx="903" cy="334" r="12" fill="#ffffff"/>

    <!-- Row 4: Model location -->
    <g transform="translate(84,424)" fill="none" stroke="#9a9aa2" stroke-width="2" stroke-linejoin="round">
      <path d="M-2 12 v-16 h7 l3 4 h10 v12 z"/>
    </g>
    <text x="124" y="430" fill="#ececf0" font-size="16" font-weight="500">Model location</text>
    <text x="124" y="455" fill="#8b8b93" font-size="13.5">Location where models are stored.</text>
    <rect x="124" y="472" width="646" height="42" rx="9" fill="#101013" stroke="#33333a"/>
    <text x="142" y="499" fill="#c9c9d0" font-size="13.5" font-family="'SF Mono', Menlo, monospace">~/.ollama/models</text>
    <rect x="786" y="472" width="132" height="42" rx="9" fill="#f2f2f5"/>
    <text x="852" y="499" text-anchor="middle" fill="#1b1b1e" font-size="14" font-weight="600">Browse</text>

    <!-- Row 5: Context length -->
    <g transform="translate(84,570)" fill="none" stroke="#9a9aa2" stroke-width="2">
      <circle cx="8" cy="4" r="7"/><circle cx="8" cy="4" r="2" fill="#9a9aa2" stroke="none"/>
    </g>
    <text x="124" y="576" fill="#ececf0" font-size="16" font-weight="500">Context length</text>
    <text x="124" y="601" fill="#8b8b93" font-size="13.5">How much of the conversation local models can remember.</text>
    <line x1="128" y1="646" x2="914" y2="646" stroke="#3a3a40" stroke-width="4" stroke-linecap="round"/>
    <line x1="128" y1="646" x2="880" y2="646" stroke="#6b6b76" stroke-width="4" stroke-linecap="round"/>
    <circle cx="880" cy="646" r="11" fill="#f2f2f5"/>
    <g fill="#7a7a83" font-size="12.5" text-anchor="middle">
      <text x="140" y="676">4k</text>
      <text x="264" y="676">8k</text>
      <text x="388" y="676">16k</text>
      <text x="512" y="676">32k</text>
      <text x="636" y="676">64k</text>
      <text x="760" y="676">128k</text>
      <text x="884" y="676">256k</text>
    </g>
  </g>
</svg>
