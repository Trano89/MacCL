    <text x="396" y="231" fill="#E37654" font-size="12.5" font-weight="700">⚒ Write</text>
    <text x="466" y="231" fill="#b9b9c0" font-size="12.5" font-family="'SF Mono', Menlo, monospace">Tests/ParserTests.swift</text>
