name: Bug report
description: Something doesn't work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Three fields in this form — version, macOS and
        backend — resolve most issues on their own; please don't skip them.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, what you got instead.
      placeholder: |
        1. Created a conversation on …
        2. Sent "…"
        3. Expected … but the app …
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: MacCL version
      description: 'Settings → the "About" tab. Paste the whole line, e.g. "MacCL 0.1.3".'
      placeholder: "0.1.3"
    validations:
      required: true

  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "14.5 — Apple silicon"
    validations:
      required: true

  - type: dropdown
    id: backend
    attributes:
      label: Which backend?
      options:
        - Anthropic (cloud models)
        - Ollama on this Mac
        - Ollama on another machine
        - Not sure
    validations:
      required: true

  - type: input
    id: model
    attributes:
      label: Model, and Ollama version if applicable
      description: "`ollama -v` on the machine that serves the model"
      placeholder: "qwen3-coder:30b — Ollama 0.32.0"

  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines
      description: |
        From `~/Library/Logs/MacCL/maccl.log`. Long token-like strings are masked
        automatically, but please have a look before pasting — logs can contain
        paths and file contents.
      render: text

  - type: textarea
    id: command
    attributes:
      label: The launch command
      description: |
        Optional but very useful. It's the grey `$ claude --model …` line in the
        transcript, just after the message that started the session — click the
        chevron on its right to expand it, then copy.
      render: shell
